<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAG+联网搜索的文档智能回复与生成可视化控制平台</title>

  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

  <style>
    :root{
      --bg:#0b1220; --panel:#121a2a; --panel2:#0f1726;
      --text:#e7eefc; --muted:#9fb0d0; --border:#22304b;
      --accent:#5aa9ff; --danger:#ff6b6b; --ok:#55d6a6; --warn:#ffd166;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
    }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
    .app{
      height:100%;
      display:grid;
      grid-template-columns:420px 1fr 420px;
      grid-template-rows:60px 1fr;
      gap:10px;
      padding:10px;
      box-sizing:border-box;
    }
    header{
      grid-column:1/4;
      display:flex;align-items:center;justify-content:space-between;
      background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:0 14px;
    }
    header .title{font-size:16px;font-weight:700;}
    header .meta{font-family:var(--mono);color:var(--muted);font-size:12px;}
    .panel{
      background:var(--panel);border:1px solid var(--border);border-radius:12px;
      overflow:hidden;display:flex;flex-direction:column;min-height:0;
    }
    .hd{
      padding:10px 12px;background:var(--panel2);border-bottom:1px solid var(--border);
      display:flex;align-items:center;justify-content:space-between;gap:10px;
    }
    .hd .name{font-weight:700;font-size:13px;}
    .hd .tools{display:flex;gap:8px;align-items:center;}
    .btn{
      font-size:12px;padding:6px 10px;border-radius:10px;border:1px solid var(--border);
      background:transparent;color:var(--text);cursor:pointer;
    }
    .btn:hover{border-color:var(--accent);}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600;}
    .btn.primary:hover{opacity:0.9;}
    .btn:disabled{opacity:0.5;cursor:not-allowed;}
    .body{padding:12px;overflow:auto;min-height:0;flex:1;display:flex;flex-direction:column;}

    /* chat */
    .chat-list{display:flex;flex-direction:column;gap:10px;flex:1;overflow:auto;}
    .msg{border:1px solid var(--border);border-radius:12px;padding:10px;}
    .msg .role{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:6px;}
    .msg .content{white-space:pre-wrap;line-height:1.4;font-size:13px;}
    .msg.user{border-color:rgba(90,169,255,.35);}
    .msg.assistant{border-color:rgba(85,214,166,.30);}
    .msg.tool{border-color:rgba(255,209,102,.30);}
    .msg.ai{border-color:rgba(85,214,166,.30);}
    .msg.human{border-color:rgba(90,169,255,.35);}

    .msg.streaming .content::after {
      content: "▌";
      animation: blink 1s infinite;
      color: var(--accent);
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    .chat-input{
      display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border);background:var(--panel2);
    }
    .chat-input textarea{
      flex:1;resize:none;height:56px;border-radius:10px;border:1px solid var(--border);
      background:rgba(0,0,0,.15);color:var(--text);padding:10px;outline:none;
    }
    .chat-input textarea:focus{border-color:var(--accent);}

    /* markdown */
    .msg .content.markdown { white-space: normal; line-height: 1.55; }
    .msg .content.markdown p { margin: 0 0 8px; }
    .msg .content.markdown ul, .msg .content.markdown ol { margin: 6px 0 10px 20px; padding: 0; }
    .msg .content.markdown li { margin: 4px 0; }
    .msg .content.markdown code {
      font-family: var(--mono); font-size: 12px; padding: 1px 5px;
      border: 1px solid var(--border); border-radius: 8px; background: rgba(0,0,0,.18);
    }
    .msg .content.markdown pre {
      font-family: var(--mono); font-size: 12px; padding: 10px; border-radius: 12px;
      border: 1px solid var(--border); background: rgba(0,0,0,.22); overflow: auto; margin: 8px 0 10px;
    }
    .msg .content.markdown pre code { padding: 0; border: none; background: transparent; }
    .msg .content.markdown blockquote {
      margin: 8px 0; padding: 8px 10px; border-left: 3px solid rgba(90,169,255,.5);
      background: rgba(0,0,0,.12); border-radius: 10px; color: var(--muted);
    }
    .msg .content.markdown table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px; }
    .msg .content.markdown th, .msg .content.markdown td { border: 1px solid var(--border); padding: 8px; }
    .msg .content.markdown th { background: rgba(0,0,0,.12); }

    /* logs */
    .logline{
      font-family:var(--mono); font-size:12px; color:var(--muted);
      margin-bottom:4px; white-space:pre-wrap; padding: 2px 0; line-height: 1.4;
    }
    .logline.err{color:var(--danger);background:rgba(255,107,107,.08);padding:4px 6px;border-radius:4px;}
    .logline.ok{color:var(--ok);}
    .logline.warn{color:var(--warn);}
    .logline.info{color:var(--muted);}
    .logline.node-enter{ color:var(--accent); font-weight:600; margin-top:6px; }
    .logline.indent{ padding-left: 12px; color: var(--muted); opacity: 0.85; }

    .kv{font-family:var(--mono);font-size:12px;color:var(--muted);}
    .kv b{color:var(--text);font-weight:700;}
    .badge{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted);}
    .badge.ok{border-color:rgba(85,214,166,.35);color:var(--ok);}
    .badge.bad{border-color:rgba(255,107,107,.35);color:var(--danger);}
    .badge.warn{border-color:rgba(255,209,102,.35);color:var(--warn);}

    #graph{
      width:100%; flex:1; min-height:280px;
      border-radius:10px; border:1px solid var(--border); background:rgba(0,0,0,.12);
    }

    /* 图例 */
    .graph-legend {
      display: flex; gap: 16px; margin-top: 10px; flex-wrap: wrap;
    }
    .legend-item {
      display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted);
    }
    .legend-dot {
      width: 12px; height: 12px; border-radius: 50%;
    }
    .legend-dot.idle { background: #4a5568; border: 2px solid #718096; }
    .legend-dot.active { background: #5aa9ff; border: 2px solid #90cdf4; box-shadow: 0 0 8px #5aa9ff; }
    .legend-dot.done { background: #55d6a6; border: 2px solid #9ae6b4; }

    /* 执行路径 */
    .graph-path {
      margin-top: 8px; padding: 8px 10px; background: rgba(0,0,0,.15);
      border-radius: 8px; font-family: var(--mono); font-size: 11px;
      color: var(--muted); min-height: 24px;
    }
    .graph-path .path-node {
      display: inline-block; padding: 2px 8px; margin: 2px;
      border-radius: 4px; background: rgba(85,214,166,.2); color: var(--ok);
    }
    .graph-path .path-node.current {
      background: rgba(90,169,255,.3); color: var(--accent);
      font-weight: 600; animation: pulse 1.5s infinite;
    }
    .graph-path .path-arrow { color: var(--muted); margin: 0 2px; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* 耗时统计 */
    .node-stats {
      margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px;
    }
    .node-stat {
      padding: 4px 8px; background: rgba(0,0,0,.15); border-radius: 6px;
      font-family: var(--mono); font-size: 10px;
    }
    .node-stat .name { color: var(--muted); }
    .node-stat .time { color: var(--ok); font-weight: 600; }

    #logBox { max-height: calc(100vh - 350px); overflow-y: auto; }

    /* ==================== */
    /* 新增：文档填充区域样式 */
    /* ==================== */
    .doc-section {
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      background: rgba(0,0,0,.1);
    }
    .doc-section.active {
      border-color: var(--accent);
      border-style: solid;
    }
    .doc-section .section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .doc-upload-area {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .doc-upload-area:hover {
      border-color: var(--accent);
      background: rgba(90,169,255,.05);
    }
    .doc-upload-area.dragover {
      border-color: var(--ok);
      background: rgba(85,214,166,.1);
    }
    .doc-upload-area input[type="file"] {
      display: none;
    }
    .doc-upload-area .icon {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .doc-upload-area .text {
      font-size: 12px;
      color: var(--muted);
    }
    .doc-info {
      margin-top: 10px;
      padding: 10px;
      background: rgba(0,0,0,.15);
      border-radius: 8px;
      font-size: 12px;
    }
    .doc-info .filename {
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }
    .doc-info .placeholders {
      color: var(--muted);
    }
    .doc-info .placeholder-tag {
      display: inline-block;
      padding: 2px 8px;
      margin: 2px;
      background: rgba(90,169,255,.15);
      border: 1px solid rgba(90,169,255,.3);
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
    }
    .doc-instruction {
      margin-top: 10px;
    }
    .doc-instruction textarea {
      width: 100%;
      height: 60px;
      resize: none;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.15);
      color: var(--text);
      padding: 10px;
      font-size: 12px;
      outline: none;
      box-sizing: border-box;
    }
    .doc-instruction textarea:focus {
      border-color: var(--accent);
    }
    .doc-actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .doc-actions label {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .doc-status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .doc-status.processing {
      background: rgba(90,169,255,.1);
      border: 1px solid rgba(90,169,255,.3);
      color: var(--accent);
    }
    .doc-status.success {
      background: rgba(85,214,166,.1);
      border: 1px solid rgba(85,214,166,.3);
      color: var(--ok);
    }
    .doc-status.error {
      background: rgba(255,107,107,.1);
      border: 1px solid rgba(255,107,107,.3);
      color: var(--danger);
    }
    .download-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 8px 16px;
      background: var(--ok);
      color: #000;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12px;
    }
    .download-link:hover {
      opacity: 0.9;
    }
    .github-link {
      display: inline-flex;
      align-items: center;
      margin-left: 12px;
      color: var(--muted); /* 默认灰色 */
      transition: all 0.2s;
      opacity: 0.7;
    }

    .github-link:hover {
      color: var(--text); /* 悬停变亮 */
      opacity: 1;
      transform: scale(1.1); /* 轻微放大效果 */
    }

    .github-link svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    #docSection {
    display: none !important;
  }
  </style>
</head>

<body>
<div class="app">
  <header>
  <div style="display:flex;align-items:center;">
    <div class="title">基于RAG+联网搜索的文档智能回复与生成可视化控制平台</div>
    <a href="https://github.com/Zjq1115/RAG_PROJECT/tree/main" target="_blank" class="github-link" title="GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
    </a>
    <span style="margin-left:8px;font-size:11px;color:var(--muted);">Code by ZJQ</span>
    <span style="margin-left:12px;font-size:11px;color:var(--muted);">v1.0.0</span>
  </div>
  <div class="meta">
    <span id="conn">WS: disconnected</span>
    <span style="margin:0 10px;">|</span>
    thread_id=<span id="tid">-</span>
  </div>
</header>

  <!-- 左：状态与日志 -->
  <section class="panel">
    <div class="hd">
      <div class="name">状态与日志</div>
      <div class="tools">
        <button class="btn" id="btnClearLogs">清空日志</button>
      </div>
    </div>
    <div class="body">
      <div class="kv" style="margin-bottom:12px;">
        <div><b>连接状态：</b><span id="wsState">-</span></div>
        <div><b>thread_id：</b><span id="stateTid">-</span></div>
        <div><b>messages_count：</b><span id="stateMsgCount">-</span></div>
        <div><b>state_keys：</b><span id="stateKeys">-</span></div>
      </div>

      <div style="border-top:1px solid var(--border); padding-top:12px;">
        <div class="kv" style="margin-bottom:8px;"><b>实时日志：</b></div>
        <div id="logBox"></div>
      </div>
    </div>
  </section>

  <!-- 中：链路 -->
  <section class="panel">
    <div class="hd">
      <div class="name">链路展示</div>
      <div class="tools">
        <button class="btn" id="btnResetGraph">重置状态</button>
      </div>
    </div>
    <div class="body">
      <div id="graph"></div>

      <div class="graph-legend">
        <div class="legend-item"><div class="legend-dot idle"></div>待执行</div>
        <div class="legend-item"><div class="legend-dot active"></div>执行中</div>
        <div class="legend-item"><div class="legend-dot done"></div>已完成</div>
      </div>

      <div class="graph-path" id="graphPath">执行路径将在此显示...</div>
      <div class="node-stats" id="nodeStats"></div>
    </div>
  </section>

  <!-- 右：对话 + 文档填充 -->
  <section class="panel">
    <div class="hd">
      <div class="name">对话 & 文档填充</div>
      <div class="tools">
        <button class="btn" id="btnClearChat">清空对话</button>
      </div>
    </div>
    <div class="body" style="gap:0;">

      <!-- 新增：文档填充区域 -->
      <div class="doc-section" id="docSection">
        <div class="section-title">📄 文档智能填充</div>

        <div class="doc-upload-area" id="docUploadArea">
          <div class="icon">📤</div>
          <div class="text">点击或拖拽上传 Word 文档 (.docx)</div>
          <div class="text" style="margin-top:4px;font-size:11px;">支持 {{占位符}} 格式</div>
          <input type="file" id="docFileInput" accept=".docx,.doc">
        </div>

        <div id="docInfoArea" style="display:none;">
          <div class="doc-info">
            <div class="filename" id="docFilename"></div>
            <div class="placeholders">
              占位符：<span id="docPlaceholders"></span>
            </div>
          </div>

          <div class="doc-instruction">
            <textarea id="docInstruction" placeholder="填写你的要求，例如：根据知识库填充项目背景，用正式的学术语言..."></textarea>
          </div>

          <div class="doc-actions">
            <button class="btn primary" id="btnFillDoc">🚀 开始填充</button>
            <button class="btn" id="btnCancelDoc">取消</button>
            <label style="margin-left:auto;">
              <input type="checkbox" id="useRag" checked> 使用知识库
            </label>
          </div>
        </div>

        <div id="docStatus" class="doc-status" style="display:none;"></div>
      </div>

      <!-- 对话列表 -->
      <div class="chat-list" id="chatList"></div>
    </div>

    <div class="chat-input">
      <textarea id="chatInput" placeholder="输入问题...（Shift+Enter 换行）"></textarea>
      <button class="btn" id="btnSend">发送</button>
    </div>
  </section>
</div>

<script>
  // =====================
  // 元素缓存
  // =====================
  const elConn = document.getElementById("conn");
  const elTid = document.getElementById("tid");
  const elWsState = document.getElementById("wsState");
  const elStateTid = document.getElementById("stateTid");
  const elStateMsgCount = document.getElementById("stateMsgCount");
  const elStateKeys = document.getElementById("stateKeys");
  const elLogBox = document.getElementById("logBox");
  const elChatList = document.getElementById("chatList");
  const elChatInput = document.getElementById("chatInput");
  const elGraphPath = document.getElementById("graphPath");
  const elNodeStats = document.getElementById("nodeStats");

  // 文档相关元素
  const elDocSection = document.getElementById("docSection");
  const elDocUploadArea = document.getElementById("docUploadArea");
  const elDocFileInput = document.getElementById("docFileInput");
  const elDocInfoArea = document.getElementById("docInfoArea");
  const elDocFilename = document.getElementById("docFilename");
  const elDocPlaceholders = document.getElementById("docPlaceholders");
  const elDocInstruction = document.getElementById("docInstruction");
  const elDocStatus = document.getElementById("docStatus");
  const elBtnFillDoc = document.getElementById("btnFillDoc");
  const elBtnCancelDoc = document.getElementById("btnCancelDoc");
  const elUseRag = document.getElementById("useRag");

  let ws = null;
  let threadId = "";

  // 节点状态追踪
  let executionPath = [];
  let nodeTimes = {};
  let lastNodeName = null;
  let lastNodeStartTime = null;

  // 流式输出相关
  let currentStreamingMsg = null;
  let streamingContent = "";

  // 文档状态
  let currentDocFileId = null;

  // =====================
  // 文档上传功能
  // =====================
  elDocUploadArea.addEventListener("click", () => elDocFileInput.click());

  elDocUploadArea.addEventListener("dragover", (e) => {
    e.preventDefault();
    elDocUploadArea.classList.add("dragover");
  });

  elDocUploadArea.addEventListener("dragleave", () => {
    elDocUploadArea.classList.remove("dragover");
  });

  elDocUploadArea.addEventListener("drop", (e) => {
    e.preventDefault();
    elDocUploadArea.classList.remove("dragover");
    const files = e.dataTransfer.files;
    if (files.length > 0) handleDocUpload(files[0]);
  });

  elDocFileInput.addEventListener("change", (e) => {
    if (e.target.files.length > 0) handleDocUpload(e.target.files[0]);
  });

  async function handleDocUpload(file) {
    if (!file.name.endsWith('.docx') && !file.name.endsWith('.doc')) {
      showDocStatus("只支持 .docx 或 .doc 文件", "error");
      return;
    }

    showDocStatus("正在上传并解析文档...", "processing");

    const formData = new FormData();
    formData.append("file", file);

    try {
      const resp = await fetch("/upload-doc", { method: "POST", body: formData });
      const data = await resp.json();

      if (!resp.ok) {
        throw new Error(data.detail || "上传失败");
      }

      currentDocFileId = data.file_id;
      elDocFilename.textContent = `📄 ${data.filename}`;

      // 显示占位符
      if (data.placeholders && data.placeholders.length > 0) {
        elDocPlaceholders.innerHTML = data.placeholders
          .map(p => `<span class="placeholder-tag">{{${p.name}}}</span>`)
          .join("");
      } else {
        elDocPlaceholders.innerHTML = '<span style="color:var(--warn)">未找到占位符</span>';
      }

      elDocUploadArea.style.display = "none";
      elDocInfoArea.style.display = "block";
      elDocSection.classList.add("active");
      hideDocStatus();

      addLog(`📄 文档上传成功: ${data.filename}`, "ok");
      addLog(`   找到 ${data.placeholders.length} 个占位符`, "info");

    } catch (err) {
      showDocStatus(`上传失败: ${err.message}`, "error");
      addLog(`❌ 文档上传失败: ${err.message}`, "err");
    }
  }

  elBtnCancelDoc.addEventListener("click", () => {
    currentDocFileId = null;
    elDocUploadArea.style.display = "block";
    elDocInfoArea.style.display = "none";
    elDocSection.classList.remove("active");
    hideDocStatus();
    elDocInstruction.value = "";
    elDocFileInput.value = "";
  });

  elBtnFillDoc.addEventListener("click", async () => {
    if (!currentDocFileId) return;

    elBtnFillDoc.disabled = true;
    showDocStatus("🔄 正在填充文档，请稍候...", "processing");
    addLog("🚀 开始填充文档...", "warn");

    const formData = new FormData();
    formData.append("file_id", currentDocFileId);
    formData.append("instruction", elDocInstruction.value);
    formData.append("use_rag", elUseRag.checked);

    try {
      const resp = await fetch("/fill-doc", { method: "POST", body: formData });
      const data = await resp.json();

      if (!resp.ok) {
        throw new Error(data.detail || "填充失败");
      }

      // 显示成功 + 下载链接
      elDocStatus.innerHTML = `
        ✅ ${data.message}<br>
        <a href="${data.download_url}" class="download-link" download>
          📥 下载填充后的文档
        </a>
      `;
      elDocStatus.className = "doc-status success";
      elDocStatus.style.display = "block";

      addLog(`✅ 文档填充完成`, "ok");
      addLog(`   已填充占位符: ${data.filled_placeholders.join(", ")}`, "info");

    } catch (err) {
      showDocStatus(`填充失败: ${err.message}`, "error");
      addLog(`❌ 文档填充失败: ${err.message}`, "err");
    } finally {
      elBtnFillDoc.disabled = false;
    }
  });

  function showDocStatus(msg, type) {
    elDocStatus.textContent = msg;
    elDocStatus.className = `doc-status ${type}`;
    elDocStatus.style.display = "block";
  }

  function hideDocStatus() {
    elDocStatus.style.display = "none";
  }

  // =====================
  // 日志 & 消息
  // =====================
  function addLog(msg, level = "info") {
    const line = document.createElement("div");
    line.className = `logline ${level}`;
    line.textContent = msg;
    elLogBox.appendChild(line);
    elLogBox.scrollTop = elLogBox.scrollHeight;
  }

  function renderMarkdown(text) {
    try {
      const raw = marked.parse(text || "");
      return DOMPurify.sanitize(raw);
    } catch { return text; }
  }

  function addMsg(role, content) {
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.innerHTML = `<div class="role">${role}</div><div class="content markdown">${renderMarkdown(content)}</div>`;
    elChatList.appendChild(div);
    elChatList.scrollTop = elChatList.scrollHeight;
  }

  function startStreaming(role) {
    const div = document.createElement("div");
    div.className = `msg ${role} streaming`;
    div.innerHTML = `<div class="role">${role}</div><div class="content markdown"></div>`;
    elChatList.appendChild(div);
    currentStreamingMsg = div;
    streamingContent = "";
    elChatList.scrollTop = elChatList.scrollHeight;
  }

  function appendToken(token) {
    if (!currentStreamingMsg) return;
    streamingContent += token;
    const contentEl = currentStreamingMsg.querySelector(".content");
    if (contentEl) {
      contentEl.innerHTML = renderMarkdown(streamingContent);
      elChatList.scrollTop = elChatList.scrollHeight;
    }
  }

  function endStreaming() {
    if (!currentStreamingMsg) return;
    currentStreamingMsg.classList.remove("streaming");
    const contentEl = currentStreamingMsg.querySelector(".content");
    if (contentEl) {
      contentEl.innerHTML = renderMarkdown(streamingContent);
    }
    currentStreamingMsg = null;
    streamingContent = "";
  }

  function setState(payload) {
    if (payload.thread_id) {
      threadId = payload.thread_id;
      elTid.textContent = threadId.substring(0, 8) + "...";
      elStateTid.textContent = threadId;
    }
    if (payload.messages_count !== undefined) {
      elStateMsgCount.textContent = payload.messages_count ?? "-";
    }
    if (payload.state_keys) {
      elStateKeys.textContent = payload.state_keys.join(", ");
    }
  }

  // =====================
  // vis-network 图
  // =====================
  const COLORS = {
    idle: { bg: '#4a5568', border: '#718096', font: '#e7eefc' },
    active: { bg: '#5aa9ff', border: '#90cdf4', font: '#ffffff' },
    done: { bg: '#55d6a6', border: '#9ae6b4', font: '#0b1220' }
  };

  const nodes = new vis.DataSet([
    { id: "START",      label: "START",      level: 0, color: { background: '#4a5568', border: '#718096' }, font: { color: '#e7eefc' } },
    { id: "agent",      label: "agent",      level: 1, color: { background: '#4a5568', border: '#718096' }, font: { color: '#e7eefc' } },
    { id: "retrieve",   label: "retrieve",   level: 2, color: { background: '#4a5568', border: '#718096' }, font: { color: '#e7eefc' } },
    { id: "rewrite",    label: "rewrite",    level: 3, color: { background: '#4a5568', border: '#718096' }, font: { color: '#e7eefc' } },
    { id: "web_search", label: "web_search", level: 3, color: { background: '#4a5568', border: '#718096' }, font: { color: '#e7eefc' } },
    { id: "generate",   label: "generate",   level: 4, color: { background: '#4a5568', border: '#718096' }, font: { color: '#e7eefc' } },
    { id: "END",        label: "END",        level: 5, color: { background: '#4a5568', border: '#718096' }, font: { color: '#e7eefc' } },
  ]);

  const edges = new vis.DataSet([
    { from: "START",      to: "agent" },
    { from: "agent",      to: "retrieve",    label: "需要检索" },
    { from: "agent",      to: "generate",    label: "无需检索", smooth: { enabled: true, type: "curvedCW", roundness: 0.3 } },
    { from: "retrieve",   to: "generate",    label: "相关" },
    { from: "retrieve",   to: "rewrite",     label: "不相关" },
    { from: "rewrite",    to: "agent" },
    { from: "rewrite",    to: "web_search",  label: "达到上限" },
    { from: "web_search", to: "generate" },
    { from: "generate",   to: "END" },
  ]);

  const network = new vis.Network(
    document.getElementById("graph"),
    { nodes, edges },
    {
      layout: {
        hierarchical: {
          enabled: true,
          direction: "UD",
          sortMethod: "directed",
          levelSeparation: 100,
          nodeSpacing: 160,
        }
      },
      physics: { enabled: false },
      interaction: { hover: true },
      nodes: {
        font: { color: "#e7eefc", size: 14 },
        borderWidth: 2,
        shadow: true,
        shape: "ellipse",
        widthConstraint: { minimum: 80 },
      },
      edges: {
        font: { color: "#9fb0d0", align: "middle", size: 10 },
        arrows: { to: { enabled: true, scaleFactor: 0.7 } },
        color: { color: '#718096', highlight: '#90cdf4' },
        smooth: { enabled: true, type: "cubicBezier", forceDirection: "vertical", roundness: 0.4 },
      }
    }
  );

  function setNodeState(nodeId, state) {
    const c = COLORS[state] || COLORS.idle;
    const update = {
      id: nodeId,
      color: { background: c.bg, border: c.border },
      font: { color: c.font },
      borderWidth: state === 'active' ? 4 : 2
    };
    if (state === 'active') {
      update.shadow = { enabled: true, color: c.bg, size: 20, x: 0, y: 0 };
    } else {
      update.shadow = { enabled: true, color: 'rgba(0,0,0,0.3)', size: 5 };
    }
    nodes.update(update);
  }

  function highlightNode(name) {
  if (!name) return;
  if (lastNodeName && lastNodeStartTime) {
    const elapsed = (Date.now() - lastNodeStartTime) / 1000;
    nodeTimes[lastNodeName] = (nodeTimes[lastNodeName] || 0) + elapsed;
    setNodeState(lastNodeName, 'done');
  }
  if (executionPath[executionPath.length - 1] !== name) {
    executionPath.push(name);
  }
  updatePathDisplay();
  updateNodeStats();
  setNodeState(name, 'active');
  lastNodeName = name;
  lastNodeStartTime = Date.now();
}

  function updatePathDisplay() {
    if (executionPath.length === 0) {
      elGraphPath.textContent = '执行路径将在此显示...';
      return;
    }
    let html = '';
    executionPath.forEach((node, idx) => {
      const isLast = idx === executionPath.length - 1;
      html += `<span class="path-node${isLast ? ' current' : ''}">${node}</span>`;
      if (!isLast) html += '<span class="path-arrow">→</span>';
    });
    elGraphPath.innerHTML = html;
  }

  function updateNodeStats() {
    const entries = Object.entries(nodeTimes).filter(([k, v]) => v > 0);
    if (entries.length === 0) {
      elNodeStats.innerHTML = '';
      return;
    }
    elNodeStats.innerHTML = entries.map(([name, time]) =>
      `<div class="node-stat"><span class="name">${name}:</span> <span class="time">${time.toFixed(2)}s</span></div>`
    ).join('');
  }

  function resetGraphState() {
    ["START", "agent", "retrieve", "rewrite", "web_search", "generate", "END"].forEach(id => {
      setNodeState(id, 'idle');
    });
    executionPath = [];
    nodeTimes = {};
    lastNodeName = null;
    lastNodeStartTime = null;
    updatePathDisplay();
    updateNodeStats();
  }

  function markCurrentNodeDone() {
    if (lastNodeName && lastNodeStartTime) {
      const elapsed = (Date.now() - lastNodeStartTime) / 1000;
      nodeTimes[lastNodeName] = (nodeTimes[lastNodeName] || 0) + elapsed;
      setNodeState(lastNodeName, 'done');
      updateNodeStats();
      updatePathDisplay();
    }
    lastNodeName = null;
    lastNodeStartTime = null;
  }

  // =====================
  // WebSocket
  // =====================
  function connectWS() {
    const proto = (location.protocol === "https:") ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen = () => {
      elConn.textContent = "WS: connected";
      elWsState.textContent = "connected";
      addLog("WebSocket connected", "ok");
      ws.send(JSON.stringify({ type: "init", thread_id: threadId || "" }));
    };

    ws.onmessage = (ev) => {
      let payload;
      try { payload = JSON.parse(ev.data); } catch(e) { return; }
      if (!payload) return;

      switch (payload.type) {
        case "log":
          addLog(payload.message || "", payload.level || "info");
          break;
        case "error":
          addLog(payload.message || "error", "err");
          if (payload.trace) addLog(payload.trace, "err");
          break;
        case "message":
          addMsg(payload.role, payload.content);
          break;
        case "state":
          setState(payload);
          break;
        case "node":
          highlightNode(payload.name);
          addLog(`📍 当前节点: ${payload.name}`, "warn");
          break;
        case "done":
          addLog("───────────────────", "info");
          // 标记最后一个活跃节点为完成（绿色）
          markCurrentNodeDone();
          // 工作流结束，END 直接标记为 done（绿色），不经过 active
          setNodeState("END", "done");
          if (executionPath[executionPath.length - 1] !== "END") {
            executionPath.push("END");
          }
          updatePathDisplay();
          updateNodeStats();
          if (currentStreamingMsg) endStreaming();
          break;
        case "stream_start":
          startStreaming(payload.role);
          break;
        case "stream_token":
          appendToken(payload.token || "");
          break;
        case "stream_end":
          endStreaming();
          break;
      }
    };

    ws.onclose = () => {
      elConn.textContent = "WS: disconnected";
      elWsState.textContent = "disconnected";
      addLog("WebSocket disconnected; retry in 1s", "warn");
      if (currentStreamingMsg) endStreaming();
      setTimeout(connectWS, 1000);
    };

    ws.onerror = () => addLog("WebSocket error", "err");
  }

  // UI Events
  document.getElementById("btnSend").onclick = () => sendChat();
  document.getElementById("btnClearChat").onclick = () => {
    elChatList.innerHTML = "";
    currentStreamingMsg = null;
    streamingContent = "";
  };
  document.getElementById("btnClearLogs").onclick = () => { elLogBox.innerHTML = ""; };
  document.getElementById("btnResetGraph").onclick = () => {
    resetGraphState();
    addLog("图状态已重置", "info");
  };

  elChatInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendChat();
    }
  });

  function sendChat() {
    const text = (elChatInput.value || "").trim();
    if (!text) return;
    elChatInput.value = "";
    if (!ws || ws.readyState !== 1) {
      addLog("WS not connected", "err");
      return;
    }

    // 每次提问：清空上一轮全部高亮和路径
    resetGraphState();
    // 立即高亮 START
    highlightNode("START");

    ws.send(JSON.stringify({
      type: "user_message",
      text: text,
      thread_id: threadId || "",
    }));
  }

  connectWS();
</script>
</body>
</html>
